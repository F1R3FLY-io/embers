[tasks.clippy]
args          = ["clippy", "--workspace", "--all-targets", "--all-features"]
command       = "cargo"
install_crate = "clippy"
workspace     = false

[tasks.generate-schema]
args      = ["run", "--bin", "generate_schema"]
command   = "cargo"
workspace = false

[tasks.audit]
args          = ["audit", "--deny", "warnings"]
command       = "cargo"
install_crate = "cargo-audit"
workspace     = false

[tasks.format]
args          = ["fmt", "--all"]
command       = "cargo"
install_crate = "rustfmt"
workspace     = false

[tasks.fmt]
alias = "format"

[tasks.format-check]
args          = ["fmt", "--all", "--check"]
command       = "cargo"
install_crate = "rustfmt"
workspace     = false

[tasks.docker-up]
script = '''
COMPOSE_FILES="--file docker/docker-compose.yaml"
if [ -f docker/docker-compose.override.yaml ]; then
    COMPOSE_FILES="$COMPOSE_FILES --file docker/docker-compose.override.yaml"
fi
docker compose $COMPOSE_FILES --project-name embers "$@" up --build --force-recreate --detach --wait
'''
workspace = false

[tasks.docker-down]
script = '''
COMPOSE_FILES="--file docker/docker-compose.yaml"
if [ -f docker/docker-compose.override.yaml ]; then
    COMPOSE_FILES="$COMPOSE_FILES --file docker/docker-compose.override.yaml"
fi
docker compose $COMPOSE_FILES --project-name embers "$@" down
'''
workspace = false

[tasks.embers]
script = '''
cd packages/embers
cargo make ${1}
'''
workspace = false

# Regenerate the rendered-Rholang corpus, then feed it through the real rholang-rs
# parser (the detached oracle crate). Fails loudly if any template renders Rholang
# the current grammar rejects.
[tasks.oracle-test]
script = '''
cargo test -p embers render_corpus
cargo test --manifest-path oracle/Cargo.toml
'''
workspace = false

# Formal-verification: check every SMT model under docs/formal/smt/ against its
# recorded verdict sequence with both z3 and cvc5. Part of the `fv` aggregate.
[tasks.fv-smt]
script    = ["bash docs/formal/scripts/verify_smt.sh"]
workspace = false

# Formal-verification: run every TLA+ model under docs/formal/tla/ with TLC and
# check each config's outcome (positive configs pass; witness configs falsify as
# expected). Part of the `fv` aggregate.
[tasks.fv-tlc]
script    = ["bash docs/formal/scripts/verify_tlc.sh"]
workspace = false

# Formal-verification: run every ProVerif protocol model under docs/formal/proverif/
# and check each query's true/false verdict against the recorded sequence. Part of
# the `fv` aggregate.
[tasks.fv-proverif]
script    = ["bash docs/formal/scripts/verify_proverif.sh"]
workspace = false

# Formal-verification aggregate: run every model-checking task. Extended as more
# tool tracks (uppaal/tamarin/mcrl2/storm/rocq) land.
[tasks.fv]
dependencies = ["fv-smt", "fv-tlc", "fv-proverif"]
workspace    = false
