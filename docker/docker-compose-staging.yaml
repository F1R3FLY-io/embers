services:
  firefly:
    image: f1r3flyindustries/f1r3fly-rust-node:latest
    pull_policy: always
    user: root
    env_file:
      - .env
    volumes:
      - ./mainnet/genesis:/var/lib/rnode/genesis
      - ./certs/node.key.pem:/var/lib/rnode/node.key.pem:ro
      - ./certs/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
    command:
      - run
      - -s
      - --validator-private-key=6a786ec387aff99fcce1bd6faa35916bfad3686d5c98e90a89f77670f535607c
      - --host=firefly
      - --no-upnp
      - --allow-private-addresses
      - --synchrony-constraint-threshold=0.0
      - --protocol-port=40400
      - --discovery-port=40404
      - --tls-key-path=/var/lib/rnode/node.key.pem
      - --tls-certificate-path=/var/lib/rnode/node.certificate.pem
    networks:
      - mainnet

  firefly-read:
    image: f1r3flyindustries/f1r3fly-rust-node:latest
    pull_policy: always
    user: root
    command:
      - run
      - --bootstrap=rnode://ebffd419dea60220734ccea8875e86d87bac10a7@firefly?protocol=40400&discovery=40404
      - --host=firefly-read
      - --no-upnp
      - --allow-private-addresses
    networks:
      - mainnet

  firefly-testnet:
    image: f1r3flyindustries/f1r3fly-rust-node:latest
    pull_policy: always
    user: root
    volumes:
      - ./testnet/genesis:/var/lib/rnode/genesis
      - ./certs/node.key.pem:/var/lib/rnode/node.key.pem:ro
      - ./certs/node.certificate.pem:/var/lib/rnode/node.certificate.pem:ro
    command:
      - run
      - -s
      - --validator-private-key=6a786ec387aff99fcce1bd6faa35916bfad3686d5c98e90a89f77670f535607c
      - --host=firefly-testnet
      - --no-upnp
      - --allow-private-addresses
      - --synchrony-constraint-threshold=0.0
      - --protocol-port=40400
      - --discovery-port=40404
      - --tls-key-path=/var/lib/rnode/node.key.pem
      - --tls-certificate-path=/var/lib/rnode/node.certificate.pem
    networks:
      - testnet

  firefly-read-testnet:
    image: f1r3flyindustries/f1r3fly-rust-node:latest
    pull_policy: always
    user: root
    command:
      - run
      - --bootstrap=rnode://ebffd419dea60220734ccea8875e86d87bac10a7@firefly-testnet?protocol=40400&discovery=40404
      - --host=firefly-read-testnet
      - --no-upnp
      - --allow-private-addresses
    networks:
      - testnet

  embers:
    image: f1r3flyio/embers:0.0.2
    pull_policy: always
    # The co-located F1r3drive mounts a FUSE filesystem; embers refuses to boot
    # unless its continuation store is inside the fsname=f1r3drive mount (see
    # docs/integrations/f1r3drive.md and docker/embers-entrypoint.sh).
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    # Secrets are NOT committed. Copy embers-staging.secrets.env.example to
    # embers-staging.secrets.env (gitignored) and fill in real values. See
    # docs/security/key-inventory.md.
    env_file:
      - ./embers-staging.secrets.env
    environment:
      # --- service (non-secret) ---
      EMBERS__ADDRESS: "0.0.0.0"
      EMBERS__PORT: "8080"
      EMBERS__LOG_LEVEL: info
      # --- mainnet node endpoints (non-secret) ---
      EMBERS__MAINNET__DEPLOY_SERVICE_URL: http://firefly:40401
      EMBERS__MAINNET__OBSERVER_URL: http://firefly-read:40403
      EMBERS__MAINNET__OBSERVER_WS_API_URL: ws://firefly-read:40403
      EMBERS__MAINNET__VALIDATOR_WS_API_URL: ws://firefly:40403
      # --- testnet node endpoints (non-secret) ---
      EMBERS__TESTNET__DEPLOY_SERVICE_URL: http://firefly-testnet:40401
      EMBERS__TESTNET__OBSERVER_URL: http://firefly-read-testnet:40403
      EMBERS__TESTNET__OBSERVER_WS_API_URL: ws://firefly-read-testnet:40403
      EMBERS__TESTNET__VALIDATOR_WS_API_URL: ws://firefly-testnet:40403
      # --- co-located F1r3drive (non-secret; the wallet + its key are in env_file) ---
      F1R3DRIVE_ENABLED: "true"
      F1R3DRIVE_VALIDATOR_HOST: firefly
      F1R3DRIVE_VALIDATOR_PORT: "40401"
      F1R3DRIVE_OBSERVER_HOST: firefly-read
      F1R3DRIVE_OBSERVER_PORT: "40403"
      F1R3DRIVE_MOUNT: /mnt/f1r3drive
      F1R3DRIVE_KEY_FILE: /data/f1r3drive/cipher.key
      F1R3DRIVE_JAR: /app/f1r3drive.jar
      F1R3DRIVE_MANUAL_PROPOSE: "false"
      NODE_HTTP_WAIT_URL: http://firefly-read:40403/status
      NODE_WAIT_TIMEOUT_SECONDS: "120"
      F1R3DRIVE_START_TIMEOUT_SECONDS: "120"
      # Secrets supplied by env_file: EMBERS__AES_ENCRYPTION_KEY,
      # EMBERS__{MAINNET,TESTNET}__{SERVICE_KEY,*_ENV_KEY},
      # EMBERS__CONTINUATION_STORE__{MOUNT_PATH,ENCRYPTION_KEY,CAPABILITY_KEY},
      # F1R3DRIVE_WALLET_ADDRESS, F1R3DRIVE_WALLET_KEY.
    volumes:
      # Persist the F1r3drive cipher-key file across restarts; losing it makes
      # previously written drive content undecryptable (docker/embers-entrypoint.sh).
      - embers-drive-key:/data/f1r3drive
    networks:
      - mainnet
      - testnet
    depends_on:
      firefly:
        condition: service_healthy
      firefly-read:
        condition: service_healthy
      firefly-testnet:
        condition: service_healthy
      firefly-read-testnet:
        condition: service_healthy

  embers-frontend:
    image: f1r3flyio/embers-frontend:0.0.2
    pull_policy: always
    environment:
      API_URL: https://localhost
    networks:
      - mainnet
      - testnet
    depends_on:
      embers:
        condition: service_started

  nginx:
    image: nginx:latest
    pull_policy: always
    container_name: nginx_proxy
    restart: always
    ports:
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certificate.crt:/etc/nginx/certs/certificate.crt
      - ./private.key:/etc/nginx/certs/private.key
    networks:
      - mainnet
      - testnet
    depends_on:
      - embers
      - embers-frontend

networks:
  mainnet:
    driver: bridge
  testnet:
    driver: bridge

volumes:
  embers-drive-key:
