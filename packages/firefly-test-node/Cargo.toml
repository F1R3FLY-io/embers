[package]
edition = "2024"
name    = "firefly-test-node"
publish = false
version = "0.1.0"

[[bin]]
name = "firefly-test-node"
path = "src/bin/firefly_test_node.rs"

[dependencies]
anyhow         = { version = "1.0" }
firefly-client = { path = "../firefly-client" }
futures        = { version = "0.3" }
poem           = { version = "3.1", features = ["websocket"] }
secp256k1      = { version = "0.31", features = ["serde"] }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = { version = "1.0" }
tokio          = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream   = { version = "0.1", features = ["net"] }
tonic          = { version = "0.14" }
tracing        = { version = "0.1" }

[dev-dependencies]
reqwest   = { version = "0.13", features = ["json"] }
tokio     = { version = "1.49", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[lints.clippy]
cast_possible_wrap    = "allow"
cast_sign_loss        = "allow"
default_trait_access  = "allow"
ignored_unit_patterns = "allow"
implicit_hasher       = "allow"
match_same_arms       = "allow"
missing_errors_doc    = "allow"
must_use_candidate    = "allow"
needless_for_each     = "allow"
too_many_lines        = "allow"

[lints.clippy.pedantic]
level    = "warn"
priority = -1

[lints.clippy.nursery]
level    = "warn"
priority = -1
