<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="642px" preserveAspectRatio="none" style="width:554px;height:642px;background:#000000;" version="1.1" viewBox="0 0 554 642" width="554px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="399.8789" x="5" y="17">PlantUML version $version$ / $git.commit.id$ [Unknown compile time]</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="3.12" x="5" y="33.3441">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="309.9503" x="5" y="49.6882">This version of PlantUML is 201 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="700" lengthAdjust="spacing" textLength="327.0143" x="5" y="66.0323">consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="24.0679" style="stroke:#33FF02;stroke-width:1;" width="543.702" x="5" y="78.3765"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="312.1569" x="6" y="93.3765">[From 35-publication-lifecycle.puml (line 27) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="5" y="116.4444">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="237.9151" x="5" y="135.5123">@startuml 35-publication-lifecycle</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="259.867" x="5" y="154.5802">skinparam backgroundColor #F8FBFF</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="191.3932" x="5" y="173.6481">skinparam shadowing false</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="219.7291" x="5" y="192.716">skinparam ArrowColor #294C60</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="304.1909" x="5" y="211.784">skinparam defaultFontName "DejaVu Sans"</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="123.2415" x="5" y="230.8519">skinparam state {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="184.0573" x="12.28" y="249.9198">BackgroundColor #E1D5E7</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="146.4114" x="12.28" y="268.9877">BorderColor #294C60</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="5.516" x="5" y="288.0556">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="5" y="307.1235">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="229.4311" x="5" y="326.1915">title F1r3sky publication lifecycle</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="5" y="345.2594">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="77.4897" x="5" y="364.3273">[*] --&gt; Draft</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="449.7902" x="5" y="383.3952">Draft --&gt; Published : publish\n(create app-password + putRecord)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="402.8065" x="5" y="402.4631">Published --&gt; PublishedStale : underlying content changes</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="375.3386" x="5" y="421.531">PublishedStale --&gt; Published : reconcile (re-putRecord)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="543.702" x="5" y="440.599">Published --&gt; Unpublished : unpublish\n(remove the record, KEEP the account)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="296.1548" x="5" y="459.6669">PublishedStale --&gt; Unpublished : unpublish</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="262.3449" x="5" y="478.7348">Unpublished --&gt; Published : re-publish</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="129.2755" x="5" y="497.8027">Unpublished --&gt; [*]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="3.64" x="5" y="516.8706">&#160;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="88.0737" x="5" y="535.9385">note bottom</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="520.616" x="12.28" y="555.0065">Unpublish removes the PDS record but keeps the account, so re-publishing</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="469.5582" x="12.28" y="574.0744">is always possible. The full state set is model-checked in the reveal/</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="307.0049" x="12.28" y="593.1423">publication lifecycle CTL model (formal T10).</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" text-decoration="wavy underline" textLength="62.2298" x="5" y="612.2102">end note</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="347.7446" x="8.64" y="631.2781">Nothing to note to (Assumed diagram type: state)</text><?plantuml-src VP9DRzim38Rl-XL4UrYorbspx_Kme4tYouOXMB9UkXrecOurov8XoWs2OVzzj1EiRjRiOiZYovSFAJw3wpMvc4J26j99UCNL5fesiqPZDDw1DGNfhRPqeRWohi4WmWnrjGw-TVdKMn_WD7sVtgJfGC4bvdvZt1eAj4o3o7K8VhDFU_dXzVJjvI2OKu6jZQbtyGlM12Sp-ectBIpHySdGFc8a-AK0RWvHvfFPc_cxBk93Jk5nfTzAHHCj_RzLfUwU_u0a-GYpW4LK_RV_NtHoBYc7grqgbz_TI0VgSB1faWQPDr8OpYGUlvAMyrWzf3qoMKOKb2iGU0fssqrBI-Vo7g1BT6jYTQ0zP0XIm6aZaL6Wv6Z5RwuP9BNk0JrGxUy9OaczLyZFuTDylkWlK6kPQnm_1N74KGtl_uLDZibataevBqFCV8o-bkVxAu4T8_TCYzbo3mfP6w4YQdW8Umxi1uLaf69b6D1kSClGU6QJoJB3IdAArjhzAZ75JbRxd6oYIzALa1ct7ymzeNqXHazk2qnNdtU9C2fygD72Qd8vlb3aSkXw-WC0?></g></svg>