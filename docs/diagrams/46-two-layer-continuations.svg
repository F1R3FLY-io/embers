12.02" y="283.182">ContinuationEnvelope</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="177.5225" x="112.02" y="299.4789">the EMBERS continuation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="212.9258" x="112.02" y="315.7757">queue &#183; joins &#183; scopes &#183; history</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="285.9541" x="112.02" y="332.0726">pending_effects &#183; pending_waits &#183; events</text></g><!--entity store--><g class="entity" data-qualified-name="P2.store" data-source-line="25" id="ent0006"><rect fill="#E8DACB" height="52.5938" rx="2.5" ry="2.5" style="stroke:#294C60;stroke-width:0.5;" width="302.3379" x="103.83" y="460.3769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="127.8252" x="113.83" y="483.372">continuation store</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="282.3379" x="113.83" y="499.6689">AES-256-GCM objects, capability-named</text></g><g class="entity" data-qualified-name="P2.GMN7" data-source-line="27" id="ent0008"><path d="M95.26,592.2669 L95.26,662.7981 A0,0 0 0 0 95.26,662.7981 L414.7331,662.7981 A0,0 0 0 0 414.7331,662.7981 L414.7331,602.2669 L404.7331,592.2669 L259,592.2669 L255,513.4669 L251,592.2669 L95.26,592.2669 A0,0 0 0 0 95.26,592.2669" fill="#FFF0C7" style="stroke:#181818;stroke-width:0.5;"/><path d="M404.7331,592.2669 L404.7331,602.2669 L414.7331,602.2669 L404.7331,592.2669" fill="#FFF0C7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="279.4619" x="101.26" y="609.3338">The embers continuation is persisted here,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="281.9819" x="101.26" y="624.4666">encrypted, as the "Continuation" artifact &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="298.4731" x="101.26" y="639.5994">beside RunRequest, Command, EffectOutbox,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="165.3057" x="101.26" y="654.7322">Observation, and Output.</text></g><!--entity rspace--><g class="entity" data-qualified-name="P3.rspace" data-source-line="35" id="ent0011"><rect fill="#FFE4A6" height="85.1875" rx="2.5" ry="2.5" style="stroke:#294C60;stroke-width:0.5;" width="284.4688" x="470.77" y="444.0769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="138.1133" x="480.77" y="467.072">RSpace tuple space</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="264.4688" x="480.77" y="483.3689">data + waiting Rholang continuations</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="174.7881" x="480.77" y="499.6657">the RSPACE continuation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="142.2217" x="480.77" y="515.9626">for (x &lt;- chan) { P }</text></g><!--entity agent--><g class="entity" data-qualified-name="P3.agent" data-source-line="36" id="ent0012"><rect fill="#FFE4A6" height="52.5938" rx="2.5" ry="2.5" style="stroke:#294C60;stroke-width:0.5;" width="264.8838" x="470.56" y="276.4869"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="244.8838" x="480.56" y="299.482">agent contract (deployed Rholang)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="226.249" x="480.56" y="315.7789">runs what each agent computes</text></g><!--entity register--><g class="entity" data-qualified-name="P3.register" data-source-line="37"