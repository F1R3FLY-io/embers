="101.26" y="629.1266">encrypted, as the "Continuation" artifact &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="298.4731" x="101.26" y="644.2594">beside RunRequest, Command, EffectOutbox,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="165.3057" x="101.26" y="659.3922">Observation, and Output.</text></g><!--entity rspace--><g class="entity" data-qualified-name="P3.rspace" data-source-line="35" id="ent0011"><rect fill="#FFE4A6" height="89.8438" rx="2.5" ry="2.5" style="stroke:#294C60;stroke-width:0.5;" width="284.4688" x="470.77" y="444.0769"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="138.1133" x="480.77" y="467.072">RSpace tuple space</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="264.4688" x="480.77" y="483.3689">data + waiting Rholang continuations</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="18" font-weight="700" lengthAdjust="spacing" textLength="253.9688" x="480.77" y="503.3786">the RSPACE continuation</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="142.2217" x="480.77" y="520.6189">for (x &lt;- chan) { P }</text></g><!--entity agent--><g class="entity" data-qualified-name="P3.agent" data-source-line="36" id="ent0012"><rect fill="#FFE4A6" height="52.5938" rx="2.5" ry="2.5" style="stroke:#294C60;stroke-width:0.5;" width="264.8838" x="470.56" y="276.4869"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="244.8838" x="480.56" y="299.482">agent contract (deployed Rholang)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="226.249" x="480.56" y="315.7789">runs what each agent computes</text></g><!--entity register--><g class="entity" data-qualified-name=