<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="606px" preserveAspectRatio="none" style="width:659px;height:606px;background:#F8FBFF;" version="1.1" viewBox="0 0 659 606" width="659px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F8FBFF" height="606" style="stroke:none;stroke-width:1;" width="659" x="0" y="0"/><g class="title" data-source-line="13"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="617.9141" x="20" y="32.9951">Event-journal merge (merge_event_sequences) &#8212; rightmost-anchor alignment</text></g><rect fill="#FFFFCC" height="18.62" rx="2.5" ry="2.5" style="stroke:#FFDD88;stroke-width:3;" width="544" x="55.457" y="50.2969"/><text fill="#000000" font-family="monospace" font-size="10" lengthAdjust="spacing" textLength="534" x="62.457" y="62.9169">This&#160;syntax&#160;is&#160;deprecated,&#160;you&#160;must&#160;add&#160;&lt;&lt;#D5E8D4&gt;&gt;&#160;at&#160;the&#160;end&#160;of&#160;the&#160;line,&#160;after&#160;the&#160;';'</text><ellipse cx="287.7734" cy="85.9169" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#D0E0E3" height="47.9375" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="248.2344" x="163.6563" y="115.9169"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="228.2344" x="173.6563" y="137.0555">inputs: durable[] (checkpoint journal),</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="114.252" x="173.6563" y="151.0243">on_chain[] (ledger)</text><rect fill="none" height="128.8281" style="stroke:#000000;stroke-width:1.5;" width="458.6328" x="58.457" y="173.8544"/><path d="M311.5293,173.8544 L311.5293,183.1512 L301.5293,193.1512 L58.457,193.1512" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="243.0723" x="61.457" y="187.8495">Find anchors (durable right-to-left)</text><rect fill="#D0E0E3" height="80.5313" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="438.6328" x="68.457" y="210.1512"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="323.5488" x="78.457" y="231.2899">for each durable[i] from the end, find the RIGHTMOST</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="327.6914" x="78.457" y="245.2587">on_chain match before the previous anchor (rposition)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="418.6328" x="78.457" y="262.9403">&gt; repeated ledger events align with the latest</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="291.873" x="78.457" y="277.8524">successful claim, not an earlier rejected attempt</text><rect fill="none" height="150.2031" style="stroke:#000000;stroke-width:1.5;" width="367.7852" x="103.8809" y="312.6825"/><path d="M379.0742,312.6825 L379.0742,321.9794 L369.0742,331.9794 L103.8809,331.9794" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="265.1934" x="106.8809" y="326.6776">Emit block-wise (anchors left-to-right)</text><rect fill="#D0E0E3" height="47.9375" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="347.7852" x="113.8809" y="348.9794"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="327.7852" x="123.8809" y="370.118">per anchor: durable segment, then on_chain segment,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="179.2148" x="123.8809" y="384.0868">then the shared anchor ONCE</text><rect fill="#D0E0E3" height="33.9688" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="250.8008" x="162.373" y="416.9169"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="230.8008" x="172.373" y="438.0555">append the durable and on_chain tails</text><rect fill="#D0E0E3" height="61.9063" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="293.9668" x="140.79" y="482.8856"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="129.7031" x="150.79" y="504.0243">merged event history</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="273.9668" x="150.79" y="517.993">(INV-D8: both inputs remain subsequences &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="216.9492" x="150.79" y="531.9618">mechanized in rocq/MergeJournal.v)</text><ellipse cx="287.7734" cy="575.7919" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="287.7734" cy="575.7919" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#294C60;stroke-width:1;" x1="287.7734" x2="287.7734" y1="95.9169" y2="115.9169"/><polygon fill="#294C60" points="283.7734,105.9169,287.7734,115.9169,291.7734,105.9169,287.7734,109.9169" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="287.7734" x2="287.7734" y1="163.8544" y2="210.1512"/><polygon fill="#294C60" points="283.7734,200.1512,287.7734,210.1512,291.7734,200.1512,287.7734,204.1512" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="287.7734" x2="287.7734" y1="396.9169" y2="416.9169"/><polygon fill="#294C60" points="283.7734,406.9169,287.7734,416.9169,291.7734,406.9169,28