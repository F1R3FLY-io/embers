<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="583px" preserveAspectRatio="none" style="width:659px;height:583px;background:#F8FBFF;" version="1.1" viewBox="0 0 659 583" width="659px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#F8FBFF" height="583" style="stroke:none;stroke-width:1;" width="659" x="0" y="0"/><g class="title" data-source-line="13"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="617.9141" x="20" y="32.9951">Event-journal merge (merge_event_sequences) &#8212; rightmost-anchor alignment</text></g><ellipse cx="327.957" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#D0E0E3" height="47.9375" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="248.2344" x="203.8398" y="92.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="228.2344" x="213.8398" y="113.4355">inputs: durable[] (checkpoint journal),</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="114.252" x="213.8398" y="127.4043">on_chain[] (ledger)</text><rect fill="none" height="128.8281" style="stroke:#000000;stroke-width:1.5;" width="458.6328" x="98.6406" y="150.2344"/><path d="M351.7129,150.2344 L351.7129,159.5313 L341.7129,169.5313 L98.6406,169.5313" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="243.0723" x="101.6406" y="164.2295">Find anchors (durable right-to-left)</text><rect fill="#D0E0E3" height="80.5313" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="438.6328" x="108.6406" y="186.5313"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="323.5488" x="118.6406" y="207.6699">for each durable[i] from the end, find the RIGHTMOST</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="327.6914" x="118.6406" y="221.6387">on_chain match before the previous anchor (rposition)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="16" font-weight="700" lengthAdjust="spacing" textLength="418.6328" x="118.6406" y="239.3203">&gt; repeated ledger events align with the latest</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="291.873" x="118.6406" y="254.2324">successful claim, not an earlier rejected attempt</text><rect fill="none" height="150.2031" style="stroke:#000000;stroke-width:1.5;" width="367.7852" x="144.0645" y="289.0625"/><path d="M419.2578,289.0625 L419.2578,298.3594 L409.2578,308.3594 L144.0645,308.3594" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="265.1934" x="147.0645" y="303.0576">Emit block-wise (anchors left-to-right)</text><rect fill="#D0E0E3" height="47.9375" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="347.7852" x="154.0645" y="325.3594"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="327.7852" x="164.0645" y="346.498">per anchor: durable segment, then on_chain segment,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="179.2148" x="164.0645" y="360.4668">then the shared anchor ONCE</text><rect fill="#D0E0E3" height="33.9688" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="250.8008" x="202.5566" y="393.2969"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="230.8008" x="212.5566" y="414.4355">append the durable and on_chain tails</text><rect fill="#D5E8D4" height="61.9063" rx="12.5" ry="12.5" style="stroke:#294C60;stroke-width:0.5;" width="293.9668" x="180.9736" y="459.2656"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="129.7031" x="190.9736" y="480.4043">merged event history</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="273.9668" x="190.9736" y="494.373">(INV-D8: both inputs remain subsequences &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="12" lengthAdjust="spacing" textLength="216.9492" x="190.9736" y="508.3418">mechanized in rocq/MergeJournal.v)</text><ellipse cx="327.957" cy="552.1719" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="327.957" cy="552.1719" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#294C60;stroke-width:1;" x1="327.957" x2="327.957" y1="72.2969" y2="92.2969"/><polygon fill="#294C60" points="323.957,82.2969,327.957,92.2969,331.957,82.2969,327.957,86.2969" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="327.957" x2="327.957" y1="140.2344" y2="186.5313"/><polygon fill="#294C60" points="323.957,176.5313,327.957,186.5313,331.957,176.5313,327.957,180.5313" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="327.957" x2="327.957" y1="373.2969" y2="393.2969"/><polygon fill="#294C60" points="323.957,383.2969,327.957,393.2969,331.957,383.2969,327.957,387.2969" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="327.957" x2="327.957" y1="267.0625" y2="325.3594"/><polygon fill="#294C60" points="323.957,315.3594,327.957,325.3594,331.957,315.3594,327.957,319.3594" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="327.957" x