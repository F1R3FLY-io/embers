\* Falsification witness: too few retries to cover the lag (MaxRetries < InitialLag).
\* Expected: BudgetCoversLag VIOLATED -- TLC prints a trace ending in phase = "gaveup",
\* the intermittent-empty read that motivated raising the read budget. NoFalseRead
\* and NoPrematureGiveUp still hold (the give-up is honest, just under-budgeted).
CONSTANT MaxRetries = 1
CONSTANT InitialLag = 2
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoFalseRead
INVARIANT NoPrematureGiveUp
INVARIANT BudgetCoversLag
CHECK_DEADLOCK FALSE
