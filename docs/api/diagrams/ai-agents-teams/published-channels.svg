points="1206.0978,311.0779,1216.0978,315.0779,1206.0978,319.0779,1210.0978,315.0779" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="926.7785" x2="1212.0978" y1="315.0779" y2="315.0779"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.9712" x="933.7785" y="273.8569">f1r3sky: published_state &#8212; chain record</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="162.6951" x="933.7785" y="291.5629">reconciled against the PDS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.0692" x="933.7785" y="309.2689">(account_exists stays three-valued)</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" data-source-line="25" id="msg5"><polygon fill="#294C60" points="1206.0978,360.49,1216.0978,364.49,1206.0978,368.49,1210.0978,364.49" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="926.7785" x2="1212.0978" y1="364.49" y2="364.49"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.4023" x="933.7785" y="340.975">mail: getChannelBindingsForTeam(id),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.6841" x="933.7785" y="358.681">filtered to channel "mail"</text></g><path d="M931,377.49 L931,475.49 L1186,475.49 L1186,387.49 L1176,377.49 L931,377.49" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1176,377.49 L1176,387.49 L1186,387.49 L1176,377.49" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.2042" x="937" y="396.387">Mail reachable is ALWAYS absent:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.9132" x="937" y="414.093">embers does not probe SMTP, so the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.7282" x="937" y="431.799">answer is unknown by design &#8212; never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.1831" x="937" y="449.505">falsely asserted, never rendered</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="78.3381" x="937" y="467.2111">as "missing".</text><g class="message" data-entity-1="part4" data-entity-2="part5" data-source-line="33" id="msg6"><polygon fill="#294C60" points="1206.0978,553.8441,1216.0978,557.8441,1206.0978,561.8441,1210.0978,557.8441" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="926.7785" x2="1212.0978" y1="557.8441" y2="557.8441"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.9702" x="933.7785" y="498.9171">chat: list every deployed version's URI</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1482" x="933.7785" y="516.6231">(each deploy mints a fresh one), then</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.7752" x="933.7785" y="534.3291">listGrantsForTeam per URI; count active</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.3193" x="933.7785" y="552.0351">(unrevoked) chat grants + distinct principals</text></g><path d="M931,570.8441 L931,650.8441 L1199,650.8441 L1199,580.8441 L1189,570.8441 L931,570.8441" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1189,570.8441 L1189,580.8441 L1199,580.8441 L1189,570.8441" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.2192" x="937" y="589.7411">The gateway dials out and exposes no</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.7312" x="937" y="607.4472">status surface, so active grants are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.7672" x="937" y="625.1532">the honest maximum embers can report</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="50.83" x="937" y="642.8592">for chat.</text><g class="message" data-entity-1="part4" data-entity-2="part3" data-source-line="42" id="msg7"><polygon fill="#294C60" points="656.3783,683.3742,646.3783,687.3742,656.3783,691.3742,652.3783,687.3742" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;stroke-dasharray:2,2;" x1="650.3783" x2="925.7785" y1="687.3742" y2="687.3742"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.4002" x="662.3783" y="681.5652">PublishedChannels { firesky?, mail[], chat }</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="43" id="msg8"><polygon fill="#294C60" points="381.517,715.0802,371.517,719.0802,381.517,723.0802,377.517,719.0802" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;stroke-dasharray:2,2;" x1="375.517" x2="644.3783" y1="719.0802" y2="719.0802"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.4021" x="387.517" y="713.2712">200 PublishedChannels</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="44" id="msg9"><polygon fill="#294C60" points="72.1928,764.4923,62.1928,768.4923,72.1928,772.4923,68.1928,768.4923" style="str